# Render.com 部署配置
# 用法：在 Render Dashboard 中选择 "Blueprint" 导入此文件，
# 或手动创建 Web Service 并参考以下配置

services:
  - type: web
    name: telegram-ai-image-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:flask_app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # 需要在 Render Dashboard 中手动设置
      - key: WEBHOOK_URL
        sync: false  # 格式: https://你的服务名.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9
